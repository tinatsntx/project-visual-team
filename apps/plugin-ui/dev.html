<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Team — dev harness</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; font: 14px/1.4 system-ui, sans-serif;
      background: #1a1b1e; color: #e8e8ea;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    header {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding: 10px 16px; background: #242529; border-bottom: 1px solid #3a3b40;
    }
    header strong { font-size: 15px; }
    header nav { display: flex; gap: 8px; align-items: center; }
    header a, header button, header span.lbl {
      color: #9ecbff; text-decoration: none; font-size: 13px;
      padding: 3px 10px; border: 1px solid #3a3b40; border-radius: 6px;
      background: transparent; font: inherit;
    }
    header a:hover, header button:hover { background: #2f3036; }
    header span.lbl { color: #8b8c91; border-color: transparent; }
    main { flex: 1; position: relative; padding: 24px; display: flex; }
    /* Simulated display-mode chrome: how the host would size the widget. */
    #stage { flex: 1; display: flex; }
    body[data-mode="inline"] #widget { width: 480px; height: 360px; margin: auto; }
    body[data-mode="fullscreen"] #widget { width: 100%; height: 100%; }
    body[data-mode="pip"] #widget {
      position: fixed; right: 24px; bottom: 24px; width: 320px; height: 220px;
      box-shadow: 0 8px 32px rgba(0,0,0,.55); border-radius: 10px;
    }
    #widget { border: 1px solid #3a3b40; border-radius: 10px; background: #fff; }
    #hostlog {
      margin: 0; padding: 12px 16px; max-height: 180px; overflow: auto;
      background: #101114; border-top: 1px solid #3a3b40;
      font: 12px/1.5 ui-monospace, Consolas, monospace; color: #a9c79a;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <!--
    Local dev harness — simulated host (PROJECT_PLAN.md §7.4).
    This page plays the ChatGPT/Codex host role: it embeds the real widget
    bundle in an iframe, answers ui/initialize + tools/call over postMessage,
    and replays a repo fixture through the real event mapper + state machine.

    Run:  npm run build --workspace @visual-team/plugin-ui
          npm run dev:serve --workspace @visual-team/plugin-ui
          open http://127.0.0.1:8788/dev.html

    Params: ?mode=inline|fullscreen|pip  ?fixture=team-with-permission|solo-posttooluse
            ?delivery=initialized|immediate|split|globals|never
            ?read=ok|reject|drop   ?capability=with|none   ?ask=reject
    delivery=initialized (default) follows spec order: the tool result is sent
    only after ui/notifications/initialized. "immediate" sends it with the
    initialize response, "split" sends public output first and private
    metadata later via openai:set_globals, "globals" delivers only through
    host globals, "never" sends nothing (bounded wait then unavailable).
    read=reject returns the real generic unknown-task error; read=drop never
    answers. capability=none strips the private metadata entirely.
    ask=reject answers the widget's ui/message re-render request with an
    error so its static guidance is visible.
    The widget polls get_visual_task through the bridge while the task is
    non-terminal — watch the log below for live bridge traffic. The host-mode
    buttons exercise host-initiated display changes without reloading the
    iframe, so terminal-task mode behavior stays visible. The read-mode
    buttons switch get_visual_task behavior in the same mounted widget —
    e.g. start ?read=reject, wait for the stale banner, click "ok", then
    Try again inside the widget to see stale → live recovery.
  -->
  <header>
    <strong>Visual Team — simulated host</strong>
    <nav>
      <span class="lbl">mode</span>
      <a href="?mode=inline">inline</a>
      <a href="?mode=fullscreen">fullscreen</a>
      <a href="?mode=pip">pip</a>
      <span class="lbl">host mode, no reload</span>
      <button type="button" data-host-mode="inline">inline</button>
      <button type="button" data-host-mode="fullscreen">fullscreen</button>
      <button type="button" data-host-mode="pip">pip</button>
      <span class="lbl">fixture</span>
      <a href="?fixture=team-with-permission">team + permission</a>
      <a href="?fixture=solo-posttooluse">solo</a>
      <span class="lbl">recovery</span>
      <a href="?delivery=never">no delivery</a>
      <a href="?delivery=split">split delivery</a>
      <a href="?delivery=globals">globals only</a>
      <a href="?read=reject">read rejects</a>
      <a href="?read=drop">read drops</a>
      <a href="?capability=none">no capability</a>
      <a href="?ask=reject">ask rejects</a>
      <span class="lbl">read mode, no reload</span>
      <button type="button" data-read-mode="ok">ok</button>
      <button type="button" data-read-mode="reject">reject</button>
      <button type="button" data-read-mode="drop">drop</button>
    </nav>
  </header>
  <main><div id="stage"><iframe id="widget" title="Visual Team widget"></iframe></div></main>
  <pre id="hostlog"></pre>
  <script type="module" src="./dist/dev-host.js"></script>
</body>
</html>
